<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小食本</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind自定义颜色 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F8BBD0',
                        secondary: '#E1F5FE',
                        accent: '#E8F5E8',
                        neutral: '#F5F5F5',
                        dark: '#424242'
                    },
                    fontFamily: {
                        sans: ['PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-neutral min-h-screen font-sans text-dark">
    <div class="container mx-auto max-w-md min-h-screen relative pb-20">
        <div id="page-container"></div>
        <footer class="fixed bottom-0 left-0 right-0 bg-white nav-shadow z-10">
            <div class="flex justify-around items-center h-16">
                <div class="tabbar-item active flex flex-col items-center justify-center" data-page="home">
                    <i class="tabbar-icon fa fa-home text-lg"></i>
                    <span class="tabbar-text text-xs mt-1">小记</span>
                </div>
                <div class="tabbar-item flex flex-col items-center justify-center" data-page="menu">
                    <i class="tabbar-icon fa fa-book text-lg"></i>
                    <span class="tabbar-text text-xs mt-1">菜谱</span>
                </div>
                <div class="tabbar-item flex flex-col items-center justify-center" data-page="eat">
                    <i class="tabbar-icon fa fa-cutlery text-lg"></i>
                    <span class="tabbar-text text-xs mt-1">吃啥</span>
                </div>
                <div class="tabbar-item flex flex-col items-center justify-center" data-page="plan">
                    <i class="tabbar-icon fa fa-calendar-o text-lg"></i>
                    <span class="tabbar-text text-xs mt-1">计划</span>
                </div>
                <div class="tabbar-item flex flex-col items-center justify-center" data-page="profile">
                    <i class="tabbar-icon fa fa-user text-lg"></i>
                    <span class="tabbar-text text-xs mt-1">我的</span>
                </div>
            </div>
        </footer>
    </div>
    <script src="js/app.js" type="module"></script>
</body>
</html>
